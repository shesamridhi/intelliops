syntax = "proto3";

package notification;

// A focused microservice: receives order/inventory events and dispatches
// notifications (email/SMS/push - stubbed here). Demonstrates gRPC as an
// internal, low-latency, strongly-typed alternative to REST for
// service-to-service communication (as required by the JD).
service NotificationService {
  rpc SendNotification (NotificationRequest) returns (NotificationResponse);
  rpc StreamNotifications (StreamRequest) returns (stream NotificationEvent);
}

message NotificationRequest {
  string recipient_id = 1;
  string channel = 2;   // "email" | "sms" | "push"
  string subject = 3;
  string message = 4;
}

message NotificationResponse {
  bool success = 1;
  string notification_id = 2;
}

message StreamRequest {
  string recipient_id = 1;
}

message NotificationEvent {
  string notification_id = 1;
  string message = 2;
  int64 timestamp = 3;
}
