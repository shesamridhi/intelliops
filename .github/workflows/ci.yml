name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run PyTest
        working-directory: ./backend
        run: python -m pytest -v

  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: ./gateway
        run: npm install
      - name: Run Jest
        working-directory: ./gateway
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run Jest
        working-directory: ./frontend
        run: npm test
      - name: Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, gateway-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Docker Image
        run: docker build -t intelliops-backend:latest ./backend
      - name: Build Gateway Docker Image
        run: docker build -t intelliops-gateway:latest ./gateway
      - name: Build Frontend Docker Image
        run: docker build -t intelliops-frontend:latest ./frontend
